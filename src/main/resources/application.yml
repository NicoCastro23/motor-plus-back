spring:
  application:
    name: motorplus
  main :
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motorplus}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:MotorPlus-2024-Clave-Super-Secreta-Minimo-32-Bytes!!}
  expiration: ${JWT_EXPIRATION_MS:86400000}

mybatis:
  type-handlers-package: com.motorplus.motorplus.mybatis
  default-scripting-language: org.apache.ibatis.scripting.xmltags.XMLLanguageDriver
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true