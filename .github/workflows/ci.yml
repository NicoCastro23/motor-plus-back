name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:postgresql://localhost:5432/motorplus_ci
      DB_USER: ci_user
      DB_PASS: ci_pass
      JWT_SECRET: CI-MotorPlus-Test-Secret-Key-Minimo-32-Bytes!!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compile (skip tests)
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7
